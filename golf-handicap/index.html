<title>ヒリヒリ・ハンデ帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* レイアウト: スコアカードの罫線を下敷きにした1カラム。上に帳面の見出しとタブ、本文はカード状の「表」を縦に積む */
:root {
  --bg: #EDF1EB;
  --surface: #FAFBF8;
  --surface-2: #F2F5F0;
  --ink: #15211A;
  --muted: #59695F;
  --line: #C9D3CA;
  --accent: #0E6A4B;
  --accent-ink: #FFFFFF;
  --flag: #C98F0E;
  --flag-soft: #F5E6BA;
  --danger: #B03F2C;
  --good: #1D7A4E;
  --f-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1310; --surface: #141D18; --surface-2: #101814; --ink: #E3EBE5; --muted: #93A399;
    --line: #2A3830; --accent: #45BF8D; --accent-ink: #05130C; --flag: #EFC14A; --flag-soft: #3A3115;
    --danger: #E57B66; --good: #57C88F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1310; --surface: #141D18; --surface-2: #101814; --ink: #E3EBE5; --muted: #93A399;
  --line: #2A3830; --accent: #45BF8D; --accent-ink: #05130C; --flag: #EFC14A; --flag-soft: #3A3115;
  --danger: #E57B66; --good: #57C88F; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  margin: 0;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 8px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.brand h1 .dot { color: var(--flag); }
.mode { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
nav.tabs button {
  flex: 1 0 auto; font: 500 14px var(--f-body); color: var(--muted); background: transparent;
  border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--flag); outline-offset: 2px; }

main { display: flex; flex-direction: column; gap: 18px; padding-block: 18px 48px; }
section.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 700; margin: 0; text-wrap: balance; }
.card-h .sub { font-size: 12px; color: var(--muted); }
.card-b { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eyebrow { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.banner { border: 1px dashed var(--flag); background: var(--flag-soft); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 14px var(--f-body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--flag); color: var(--flag); margin-left: 6px; vertical-align: 2px; font-weight: 700; }

/* スコアカード風の表 */
.sc-scroll { overflow-x: auto; }
table.sc { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.sc th { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--accent-ink); background: var(--accent); text-align: left; padding: 6px 10px; white-space: nowrap; }
table.sc td { border-top: 1px solid var(--line); padding: 8px 10px; vertical-align: middle; }
table.sc td + td, table.sc th + th { border-left: 1px solid var(--line); }
table.sc th + th { border-left-color: color-mix(in srgb, var(--accent-ink) 25%, transparent); }
table.sc .num { font-family: var(--f-num); font-weight: 600; font-size: 20px; text-align: right; white-space: nowrap; }
table.sc .num.big { font-size: 26px; }
table.sc .name { font-weight: 700; min-width: 5.5em; }
table.sc .r { text-align: right; }
.delta-up { color: var(--danger); }
.delta-down { color: var(--good); }
.rank1 td { background: color-mix(in srgb, var(--flag-soft) 70%, transparent); }

.prob { display: flex; align-items: center; gap: 8px; min-width: 8.5em; }
.bar { position: relative; flex: 1; height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; }
.bar > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--flag); }
.prob span { font-family: var(--f-num); font-weight: 600; font-size: 16px; min-width: 2.8em; text-align: right; }

.meter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.meter > div { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meter > div + div { border-left: 1px solid var(--line); }
.meter .v { font-family: var(--f-display); font-size: 30px; line-height: 1.1; }
.meter .v small { font-family: var(--f-body); font-size: 13px; font-weight: 700; margin-left: 2px; }
.meter .v.hot { color: var(--flag); }
.meter .k { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) {
  .meter { grid-template-columns: 1fr 1fr; }
  .meter > div:first-child { grid-column: 1 / -1; border-bottom: 1px solid var(--line); }
  .meter > div:nth-child(2) { border-left: 0; }
}

.form-row { display: flex; flex-wrap: wrap; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; color: var(--muted); font-weight: 700; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  font: 500 16px var(--f-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; min-height: 120px; }
input.gross { font-family: var(--f-num); font-size: 24px; font-weight: 600; width: 5.2em; text-align: center; padding: 4px 6px; }
input.base { width: 5.5em; font-family: var(--f-num); font-size: 18px; text-align: center; }

.btn { font: 700 15px var(--f-body); border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { font-size: 13px; padding: 5px 10px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.result-hero { display: flex; flex-direction: column; gap: 4px; }
.result-hero .who { font-family: var(--f-display); font-size: 26px; line-height: 1.2; }
.result-hero .who .flag { color: var(--flag); }

.round-list { display: flex; flex-direction: column; gap: 0; }
.round { border-top: 1px solid var(--line); }
.round:first-child { border-top: 0; }
.round-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
.round-h .d { font-family: var(--f-num); font-weight: 600; font-size: 18px; }
.ranks { display: flex; gap: 4px; flex-wrap: wrap; }
.ranks span { font-family: var(--f-num); font-weight: 600; font-size: 14px; padding: 0 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.ranks span.w { background: var(--flag-soft); border-color: var(--flag); }

.howto { display: grid; gap: 14px; }
.howto > div { display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: start; }
.howto .n { font-family: var(--f-display); font-size: 22px; color: var(--accent); line-height: 1.2; }
.howto h3 { font-size: 15px; margin: 0 0 2px; }
.howto p { font-size: 14px; color: var(--muted); max-width: 62ch; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width .4s ease; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>ヒリヒリ<span class="dot">・</span>ハンデ帳</h1>
      <span class="mode" id="mode">読み込み中…</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="画面">
      <button role="tab" id="tab-today" data-tab="today" aria-selected="true">今日のハンデ</button>
      <button role="tab" id="tab-records" data-tab="records" aria-selected="false">成績</button>
      <button role="tab" id="tab-members" data-tab="members" aria-selected="false">メンバー</button>
      <button role="tab" id="tab-rules" data-tab="rules" aria-selected="false">しくみ</button>
    </nav>
  </div>
</header>
<div class="wrap">
  <main id="view">
    <section class="card"><div class="empty">ラウンドの記録を読み込んでいます。メンバーを登録すると、ここに今日のハンデと優勝確率が出ます。</div></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="handicap.js"></script>
<script src="app.js"></script>
